<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor 3D de edificios</title>
  </head>
  <body>
    <div id="legend">
      <h2>Cámara</h2>
      <ul>
        <li><kbd>Clic izq.</kbd>Rotar</li>
        <li><kbd>Rueda</kbd>Zoom</li>
        <li><kbd>Clic der.</kbd>Desplazar</li>
      </ul>
      <h2>Zona</h2>
      <ul>
        <li><kbd>N</kbd>Colocar zona en el edificio</li>
        <li><kbd>G</kbd>Mover</li>
        <li><kbd>S</kbd>Escalar</li>
        <li><kbd>Esc</kbd>Quitar zona</li>
        <li><kbd>C</kbd>Mostrar/ocultar comentarios</li>
      </ul>
    </div>
    <div id="comment-panel">
      <h2>Comentario</h2>
      <textarea id="comment-text" placeholder="Escribe un comentario..."></textarea>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
